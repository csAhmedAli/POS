<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - POS System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">POS SYSTEM - SETTINGS</div>
        <div class="nav-links">
            <button id="nav-pos">POS</button>
            <button id="nav-products">Products</button>
            <button id="nav-reports">Reports</button>
            <button id="nav-settings" class="active">Settings</button>
        </div>
    </nav>

    <div class="report-section">
        <h2>Admin Settings</h2>
        <div id="settings-form" class="modal" style="position: static; margin-top: 2rem; width: 100%; max-width: 500px;">
            <h3>Change Password</h3>
            <p style="margin-bottom: 1rem;">Verify your current password and set a new one.</p>
            <input type="password" id="old-pwd" placeholder="Current password">
            <input type="password" id="new-pwd" placeholder="New password">
            <input type="password" id="confirm-pwd" placeholder="Confirm new password">
            <button id="btn-update-pwd">Update Password</button>
        </div>

        <div class="modal" style="position: static; margin-top: 2rem; width: 100%; max-width: 500px;">
            <h3>Printer Configuration</h3>
            <p style="margin-bottom: 1rem;">Select hardware printers for receipts through the wire.</p>
            
            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Customer Receipt Printer (Full Bill + General Items)</label>
            <select id="select-printer-customer" style="width: 100%; padding: 0.8rem; margin-bottom: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">Default Printer</option>
            </select>
            <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                <button id="btn-test-customer" style="flex: 1; font-size: 0.8rem; padding: 0.5rem;">Test Customer Printer</button>
                <button id="btn-status-customer" style="flex: 1; font-size: 0.8rem; padding: 0.5rem; background: #666;">Check Status</button>
            </div>

            <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Kitchen Order Printer (Pizza Only)</label>
            <select id="select-printer-chef" style="width: 100%; padding: 0.8rem; margin-bottom: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                <option value="">Default Printer</option>
            </select>
            <div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
                <button id="btn-test-chef" style="flex: 1; font-size: 0.8rem; padding: 0.5rem;">Test Kitchen Printer</button>
                <button id="btn-status-chef" style="flex: 1; font-size: 0.8rem; padding: 0.5rem; background: #666;">Check Status</button>
            </div>

            <button id="btn-save-printers" style="background: var(--accent);">Save Printer Settings</button>
        </div>




    <script>
        document.getElementById('nav-pos').addEventListener('click', () => window.api.navigateTo('index.html'));
        document.getElementById('nav-products').addEventListener('click', () => window.api.navigateTo('products.html'));
        document.getElementById('nav-reports').addEventListener('click', () => window.api.navigateTo('reports.html'));

        // Load Printers and Settings
        async function initPrinters() {
            const printers = await window.api.getPrinters();
            const customerSelect = document.getElementById('select-printer-customer');
            const chefSelect = document.getElementById('select-printer-chef');

            printers.forEach(p => {
                const opt1 = document.createElement('option');
                opt1.value = p.name;
                opt1.innerText = (p.displayName || p.name) + (p.isDefault ? ' (Default)' : '');
                customerSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = p.name;
                opt2.innerText = (p.displayName || p.name) + (p.isDefault ? ' (Default)' : '');
                chefSelect.appendChild(opt2);
            });

            // Load saved settings
            const savedCustomer = await window.api.getSetting('printer_customer');
            const savedChef = await window.api.getSetting('printer_chef');
            if (savedCustomer) customerSelect.value = savedCustomer;
            if (savedChef) chefSelect.value = savedChef;
        }

        document.getElementById('btn-save-printers').addEventListener('click', async () => {
            const customer = document.getElementById('select-printer-customer').value;
            const chef = document.getElementById('select-printer-chef').value;
            await window.api.setSetting('printer_customer', customer);
            await window.api.setSetting('printer_chef', chef);
            alert("Printer settings saved!");
        });

        // Test and Status Logic
        async function testPrinter(selectId) {
            const printerName = document.getElementById(selectId).value;
            const testContent = `
                <div style="text-align:center; font-family:monospace;">
                    <h3>TEST PRINT</h3>
                    <p>Printer: ${printerName || 'Default'}</p>
                    <p>Time: ${new Date().toLocaleTimeString()}</p>
                    <hr>
                    <p>SUCCESSFUL</p>
                </div>
            `;
            window.api.printSingle({ content: testContent, printer: printerName });
            alert(`Test print job sent to: ${printerName || 'Default'}`);
        }

        async function checkStatus(selectId) {
            const printerName = document.getElementById(selectId).value;
            if (!printerName) {
                alert("Please select a printer first.");
                return;
            }
            const result = await window.api.checkPrinterStatus(printerName);
            alert(`Printer: ${printerName}\nStatus: ${result.status.toUpperCase()}\n\nDetails: ${result.message}`);
        }

        document.getElementById('btn-test-customer').addEventListener('click', () => testPrinter('select-printer-customer'));
        document.getElementById('btn-test-chef').addEventListener('click', () => testPrinter('select-printer-chef'));
        document.getElementById('btn-status-customer').addEventListener('click', () => checkStatus('select-printer-customer'));
        document.getElementById('btn-status-chef').addEventListener('click', () => checkStatus('select-printer-chef'));

        initPrinters();

        document.getElementById('btn-update-pwd').addEventListener('click', async () => {

            const oldP = document.getElementById('old-pwd').value;
            const p1 = document.getElementById('new-pwd').value;
            const p2 = document.getElementById('confirm-pwd').value;

            const currentP = await window.api.getPassword();
            
            if (oldP !== currentP) {
                alert("Incorrect current password!");
                return;
            }

            if (p1 && p1 === p2) {
                await window.api.setPassword(p1);
                alert("Password updated successfully!");
                document.getElementById('old-pwd').value = '';
                document.getElementById('new-pwd').value = '';
                document.getElementById('confirm-pwd').value = '';
            } else {
                alert("New passwords do not match or are empty!");
            }
        });

        // Enter Key Navigation
        function setupEnterKey() {
            // Password Section
            const pwdInputs = [
                document.getElementById('old-pwd'),
                document.getElementById('new-pwd'),
                document.getElementById('confirm-pwd')
            ];
            const pwdBtn = document.getElementById('btn-update-pwd');

            pwdInputs.forEach((input, index) => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (index < pwdInputs.length - 1) {
                            pwdInputs[index + 1].focus();
                        } else {
                            pwdBtn.click();
                        }
                    }
                });
            });

            // Printer Section (Though these are selects, the user might want Enter to save)
            // But usually Enter on select opens it. I'll stick to just password inputs for now 
            // unless the user specifically asked for "most things".
        }
        setupEnterKey();
    </script>


</body>
</html>
