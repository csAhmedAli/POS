<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Products - POS System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">POS SYSTEM - PRODUCTS</div>
        <div class="nav-links">
            <button id="nav-pos">POS</button>
            <button id="nav-products" class="active">Products</button>
            <button id="nav-reports">Reports</button>
            <button id="nav-settings">Settings</button>
        </div>
    </nav>

    <div class="report-section">
        <h2>Product Management</h2>
        
        <div style="background: white; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
            <h3>Add / Edit Product</h3>
            <div style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
                <input type="hidden" id="prod-id">
                <input type="text" id="prod-name" placeholder="Product Name" style="flex: 1; min-width: 200px;">
                <select id="prod-category" style="flex: 1; min-width: 150px; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px;">
                    <option value="" disabled selected>Select Category</option>
                    <option value="BAR BQ">BAR BQ</option>
                    <option value="Zingar Burger">Zingar Burger</option>
                    <option value="Burgers">Burgers (Shami/Anda)</option>
                    <option value="Pizza">Pizza</option>
                    <option value="Matka Items">Matka Items</option>
                    <option value="Chicken Shawarma">Chicken Shawarma</option>
                    <option value="Grill Shawarma">Grill Shawarma</option>
                    <option value="Deals">Deals</option>
                    <option value="Crispy Wings">Crispy Wings</option>
                    <option value="Chez Loaded Fries">Chez Loaded Fries</option>
                    <option value="Fries">Fries</option>
                    <option value="Wrap">Wrap</option>
                    <option value="Siders">Siders</option>
                    <option value="Cold Drinks">Cold Drinks</option>
                </select>
                <input type="number" id="prod-price" placeholder="Price" style="width: 100px;">
                <button id="btn-save-prod" style="padding: 0.8rem 2rem; background: var(--accent);">Save Product</button>
                <button id="btn-cancel-edit" class="hidden" style="padding: 0.8rem 2rem; background: var(--danger);">Cancel</button>
            </div>
        </div>

        <table class="report-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="products-table-body">
                <!-- Products will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        let editingId = null;

        async function loadProducts() {
            const products = await window.api.getProducts();
            const tbody = document.getElementById('products-table-body');
            tbody.innerHTML = '';
            
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>Rs ${p.price.toFixed(2)}</td>
                    <td>
                        <button onclick="editProduct(${p.id}, '${p.name}', '${p.category}', ${p.price})" style="background: var(--primary); color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">Edit</button>
                        <button onclick="deleteProduct(${p.id})" style="background: var(--danger); color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('btn-save-prod').addEventListener('click', async () => {
            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const price = parseFloat(document.getElementById('prod-price').value);

            if (!name || !category || isNaN(price)) {
                alert("Please fill all fields correctly");
                return;
            }

            const product = { name, category, price, cost: 0 };
            
            if (editingId) {
                product.id = editingId;
                await window.api.updateProduct(product);
                editingId = null;
                alert("Product updated!");
            } else {
                await window.api.addProduct(product);
                alert("Product added!");
            }

            clearForm();
            loadProducts();
        });

        window.editProduct = (id, name, category, price) => {
            editingId = id;
            document.getElementById('prod-name').value = name;
            document.getElementById('prod-category').value = category;
            document.getElementById('prod-price').value = price;
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            document.getElementById('btn-save-prod').innerText = "Update Product";
        };

        window.deleteProduct = async (id) => {
            if (confirm("Are you sure you want to delete this product?")) {
                await window.api.deleteProduct(id);
                loadProducts();
            }
        };

        function clearForm() {
            editingId = null;
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-category').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            document.getElementById('btn-save-prod').innerText = "Save Product";
        }

        document.getElementById('btn-cancel-edit').addEventListener('click', clearForm);

        // Enter Key Navigation
        function setupEnterKeyNavigation() {
            const inputs = [
                document.getElementById('prod-name'),
                document.getElementById('prod-category'),
                document.getElementById('prod-price'),
            ];
            const submitBtn = document.getElementById('btn-save-prod');

            inputs.forEach((input, index) => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            submitBtn.click();
                        }
                    }
                });
            });
        }
        setupEnterKeyNavigation();

        // Navigation
        document.getElementById('nav-pos').addEventListener('click', () => window.api.navigateTo('index.html'));
        document.getElementById('nav-reports').addEventListener('click', () => window.api.navigateTo('reports.html'));
        document.getElementById('nav-settings').addEventListener('click', () => window.api.navigateTo('settings.html'));

        loadProducts();
    </script>
</body>
</html>
