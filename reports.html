<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports - POS System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">POS SYSTEM - REPORTS</div>
        <div class="nav-links">
            <button id="nav-pos">POS</button>
            <button id="nav-products">Products</button>
            <button id="nav-reports" class="active">Reports</button>
            <button id="nav-settings">Settings</button>
        </div>
    </nav>

    <div class="report-section">

        <!-- Daily Summary -->
        <section>
            <h2 class="section-header">Daily Summary</h2>
            <div id="summary-cards" class="summary-cards">
                <div class="summary-card">
                    <div class="label">Total Orders</div>
                    <div id="total-orders" class="value">0</div>
                </div>
                <div class="summary-card">
                    <div class="label">Total price</div>
                    <div id="total-revenue" class="value">Rs 0.00</div>
                </div>
            </div>

        </section>

        <!-- Product Wise Sales -->
        <section>
            <div style="margin-bottom: 0.75rem;">
            </div>
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Qty Sold</th>
                        <th>Unit Price</th>
                        <th>Total price</th>
                    </tr>
                </thead>
                <tbody id="product-sales-body">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </section>

        <!-- Historical Reports -->
        <section>
            <div style="margin-bottom: 0.75rem;">
            </div>
            <p><small>Click any row to view detailed sales for that day.</small></p>

            <table class="report-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Orders</th>
                        <th>Total price</th>
                        <th style="width: 100px;">Action</th>
                    </tr>
                </thead>
                <tbody id="historical-reports-body" style="cursor: pointer;">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </section>

    </div>

    <!-- Details Modal -->
    <div id="details-overlay" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto; padding: 2rem;">
        <div style="background: white; padding: 2rem; border-radius: 8px; width: 95%; max-width: 1100px; margin: auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="details-title">Daily Sales Details</h2>
                <button id="btn-close-details" style="padding: 0.5rem 1rem;">Close</button>
            </div>

            <!-- Sales Details Section Header -->
            <h3 class="section-header" style="font-size:1rem; margin-bottom: 1rem;">Sales Details</h3>

            <table class="report-table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Total price</th>
                    </tr>
                </thead>
                <tbody id="details-body">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ── Helpers ──────────────────────────────────────────
        function profitClass(val) {
            return val >= 0 ? 'profit-positive' : 'profit-negative';
        }

        function fmt(val) {
            return `Rs ${(val || 0).toFixed(2)}`;
        }

        // ── Load Main Reports ────────────────────────────────
        async function loadReports() {
            const summary    = await window.api.getSummary();
            const productSales = await window.api.getProductWiseSales();
            const historical = await window.api.getHistoricalReports();

            // --- Summary Cards ---
            const totalOrders  = summary.total_orders  || 0;
            const totalRevenue = summary.total_revenue || 0;

            document.getElementById('total-orders').innerText  = totalOrders;
            document.getElementById('total-revenue').innerText = fmt(totalRevenue);

            // --- Product Wise Sales ---
            const tbodyProd = document.getElementById('product-sales-body');
            tbodyProd.innerHTML = '';

            if (!productSales || productSales.length === 0) {
                tbodyProd.innerHTML = `<tr class="no-data-row"><td colspan="4">No data available</td></tr>`;
            } else {
                // Group by category
                const catGroups = new Map();
                productSales.forEach(sale => {
                    const cat = sale.category || 'Uncategorized';
                    if (!catGroups.has(cat)) catGroups.set(cat, { name: cat, items: [], total: 0 });
                    catGroups.get(cat).items.push(sale);
                    catGroups.get(cat).total += sale.total_revenue;
                });

                let overallGrandTotal = 0;
                catGroups.forEach(group => {
                    overallGrandTotal += group.total;
                    
                    // Category Header
                    const headTr = document.createElement('tr');
                    headTr.style.background = '#f9f9f9';
                    headTr.style.fontWeight = 'bold';
                    headTr.innerHTML = `<td colspan="4" style="color: var(--primary); padding: 10px;">📂 ${group.name.toUpperCase()}</td>`;
                    tbodyProd.appendChild(headTr);

                    // Product Rows
                    group.items.forEach(sale => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="padding-left: 20px;">${sale.product_name}</td>
                            <td>${sale.total_quantity}</td>
                            <td>${fmt(sale.unit_price)}</td>
                            <td>${fmt(sale.total_revenue)}</td>
                        `;
                        tbodyProd.appendChild(tr);
                    });

                    // Category Total
                    const totalTr = document.createElement('tr');
                    totalTr.style.background = '#fff';
                    totalTr.style.fontSize = '0.9rem';
                    totalTr.style.color = '#555';
                    totalTr.innerHTML = `
                        <td colspan="3" style="text-align: right; font-weight: bold; padding: 8px;">Total ${group.name}:</td>
                        <td style="font-weight: bold; padding: 8px;">${fmt(group.total)}</td>
                    `;
                    tbodyProd.appendChild(totalTr);
                });

                // Final Overall Total
                const finalTr = document.createElement('tr');
                finalTr.style.background = '#2c3e50';
                finalTr.style.color = 'white';
                finalTr.style.fontWeight = 'bold';
                finalTr.style.fontSize = '1.1rem';
                finalTr.innerHTML = `
                    <td colspan="3" style="text-align: right; padding: 12px;">OVERALL TOTAL SALES:</td>
                    <td style="padding: 12px;">${fmt(overallGrandTotal)}</td>
                `;
                tbodyProd.appendChild(finalTr);
            }

            // --- Historical Reports ---
            const tbodyHist = document.getElementById('historical-reports-body');
            tbodyHist.innerHTML = '';

            if (!historical || historical.length === 0) {
                tbodyHist.innerHTML = `<tr class="no-data-row"><td colspan="5">No data available</td></tr>`;
            } else {
                historical.forEach(rep => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${rep.date}</td>
                        <td>${rep.total_orders}</td>
                        <td>${fmt(rep.total_revenue)}</td>
                        <td>
                            <button class="row-export-btn" style="
                                background: #2c3e50;
                                color: white;
                                border: none;
                                padding: 4px 8px;
                                border-radius: 4px;
                                cursor: pointer;
                                font-size: 0.75rem;
                            ">Export</button>
                        </td>
                    `;
                    // Clicking the row (except the button) shows details
                    tr.onclick = (e) => {
                        if (e.target.classList.contains('row-export-btn')) return;
                        showDetails(rep.date);
                    };

                    // Handle row export button
                    tr.querySelector('.row-export-btn').onclick = async (e) => {
                        e.stopPropagation();
                        const btn = e.target;
                        btn.textContent = '...';
                        btn.disabled = true;
                        try {
                            const details = await window.api.getDetailedHistory(rep.date);
                            const res = await window.api.exportSingleDayReport(rep.date, details);
                            if (res.success) alert(`✅ Exported: ${res.filePath}`);
                        } finally {
                            btn.textContent = 'Export';
                            btn.disabled = false;
                        }
                    };
                    tbodyHist.appendChild(tr);
                });
            }
        }

        // ── Show Grouped Sales Details ───────────────────────
        async function showDetails(dateStr) {
            const items = await window.api.getDetailedHistory(dateStr);

            document.getElementById('details-title').innerText = `Sales Details — ${dateStr}`;
            const tbody = document.getElementById('details-body');
            tbody.innerHTML = '';

            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr class="no-data-row"><td colspan="6">No data available</td></tr>`;
                document.getElementById('details-overlay').classList.remove('hidden');
                return;
            }

            // Group items by category
            const catGroups = new Map();
            items.forEach(item => {
                const cat = item.category || 'Uncategorized';
                if (!catGroups.has(cat)) {
                    catGroups.set(cat, { name: cat, items: [], total: 0 });
                }
                catGroups.get(cat).items.push(item);
                catGroups.get(cat).total += (item.line_total || 0);
            });

            // Render each group
            let grandTotal = 0;
            catGroups.forEach(group => {
                grandTotal += group.total;

                // Category Header Row
                const headerTr = document.createElement('tr');
                headerTr.style.background = '#f9f9f9';
                headerTr.style.fontWeight = 'bold';
                headerTr.innerHTML = `<td colspan="4" style="color: var(--primary); padding: 10px;">📂 ${group.name.toUpperCase()}</td>`;
                tbody.appendChild(headerTr);

                // Product rows
                group.items.forEach(item => {
                    const itemTr = document.createElement('tr');
                    itemTr.innerHTML = `
                        <td style="padding-left: 20px;">${item.product_name}</td>
                        <td>${item.quantity}</td>
                        <td>${fmt(item.price)}</td>
                        <td>${fmt(item.line_total)}</td>
                    `;
                    tbody.appendChild(itemTr);
                });

                // Category Total row
                const totalTr = document.createElement('tr');
                totalTr.style.fontSize = '0.9rem';
                totalTr.innerHTML = `
                    <td colspan="3" style="text-align: right; font-weight: bold; padding: 8px;">Total ${group.name}:</td>
                    <td style="font-weight: bold; padding: 8px;">${fmt(group.total)}</td>
                `;
                tbody.appendChild(totalTr);
            });

            // Add Grand Total Footer
            const footerTr = document.createElement('tr');
            footerTr.style.background = '#f1f1f1';
            footerTr.style.fontWeight = 'bold';
            footerTr.style.fontSize = '1.2rem';
            footerTr.innerHTML = `
                <td colspan="3" style="text-align: right; padding: 1rem;">OVERALL DAY TOTAL:</td>
                <td style="padding: 1rem;">${fmt(grandTotal)}</td>
            `;
            tbody.appendChild(footerTr);

            document.getElementById('details-overlay').classList.remove('hidden');
        }

        // ── Events ───────────────────────────────────────────
        document.getElementById('btn-close-details').addEventListener('click', () => {
            document.getElementById('details-overlay').classList.add('hidden');
        });

        document.getElementById('nav-pos').addEventListener('click',      () => window.api.navigateTo('index.html'));
        document.getElementById('nav-products').addEventListener('click', () => window.api.navigateTo('products.html'));
        document.getElementById('nav-settings').addEventListener('click', () => window.api.navigateTo('settings.html'));


        loadReports();
    </script>
</body>
</html>
